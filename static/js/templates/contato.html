
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Clínica Vida Leve</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
<div class="layout">

    <aside class="sidebar">
        <h2>CONTATO</h2>
        <ul>
            <li><a href="../index.html">Início</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="especialidades.html">Especialidades</a></li>
            <li><a href="medicos.html">Médicos</a></li>
        </ul>
    </aside>

    <main class="conteudo">
        <section class="pagina">
            <h1>Agende sua consulta</h1>
            <p>Preencha os campos abaixo para solicitar um atendimento.</p>

            <form id="formulario">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required>

                <label for="especialidade">Especialidade:</label>
                <select id="especialidade" name="especialidade" required>
                    <option value="">Selecione uma especialidade</option>
                    <option>Cardiologia</option>
                    <option>Clínica Médica</option>
                    <option>Dermatologia</option>
                    <option>Neurologia</option>
                    <option>Nutrição</option>
                    <option>Ortopedia</option>
                    <option>Urologia</option>
                </select>

                <label for="observacao">Mensagem:</label>
                <textarea id="observacao" name="observacao"
                    placeholder="Escreva sua mensagem"></textarea>

                <button class="botao" type="submit">Enviar solicitação</button>
            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>

            <h2>Endereço</h2>
            <p>Av. Pres. Juscelino Kubitscheck de Oliveira, 365 – Centro, Sorocaba – SP.</p>
            <p>Telefone: (15) 98603-4395</p>
        </section>
    </main>
</div>
<script src="../static/js/main.js"></script>
<script src="../static/js/formulario.js"></script>
</body>
</html>
